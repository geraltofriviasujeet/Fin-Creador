# CI for pull requests and for every push to main (after a merge, same jobs): app checks, secret check, database (migration + pgTAP) tests,
# web end-to-end tests and the mobile design-system preview (Expo web).
# Runs only against throwaway services on the GitHub runner. It never connects to the
# hosted Supabase project and uses no repository secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A PR's runs share a group (a new push cancels the old run); each push to main runs to the end.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The canary is a fake server-only value; the secret check below proves it never
      # reaches the client bundle. It is not a real key.
      - name: Build web
        run: npm run build
        env:
          FC_CANARY_SERVER_ONLY: fc-canary-${{ github.run_id }}-not-a-secret
          SUPABASE_SERVICE_ROLE_KEY: fc-canary-${{ github.run_id }}-not-a-secret
          ANTHROPIC_API_KEY: fc-canary-${{ github.run_id }}-not-a-secret
          TAVILY_API_KEY: fc-canary-${{ github.run_id }}-not-a-secret

      # Bundles the Expo app for iOS and Android (Hermes bytecode) without a device or
      # native build, so import, syntax and route errors fail here.
      - name: Bundle mobile
        run: npm run bundle:mobile
        env:
          CI: "1"

      # Plain-JS export of the same app for the secret check (bytecode packs strings
      # together, which hides string boundaries from the scanner).
      - name: Bundle mobile (JS, for secret check)
        run: npm run bundle:mobile:js
        env:
          CI: "1"

      - name: Secret check (repo, web client bundle, mobile bundles)
        run: node scripts/check-secrets.mjs --repo apps/web/.next/static apps/mobile/dist-js
        env:
          CHECK_SECRETS_CANARY: fc-canary-${{ github.run_id }}-not-a-secret

      # Sprint 12c: the design-system preview is development-only and must not ship.
      - name: Design-system preview left out of production bundles
        run: node scripts/check-mobile-preview-excluded.mjs apps/mobile/dist apps/mobile/dist-js

  # Mobile app on Expo web at 390px, a development export served statically (the design-system
  # preview is not in production builds). Sprint 12c: every preview component renders without
  # errors (screenshots: mobile-design-system-screenshots artifact). Sprint 13a: the signed-in
  # app (tab shell, Home) against its own throwaway local Supabase, with fresh demo users. Runs
  # in parallel with the web E2E job, so it adds no wall-clock time while it stays shorter.
  # The job name is kept so any required-check settings still match.
  mobile-preview:
    name: Mobile design-system preview (Expo web)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.111.0 # keep in step with the CLI used locally

      - name: Install dependencies
        run: npm ci

      # Throwaway Supabase on the runner (Postgres with all migrations, Auth, API gateway,
      # PostgREST, Mailpit). Never the hosted project.
      - name: Start local Supabase
        run: supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      # Only the public URL and the public (publishable/anon) key are exported.
      - name: Point the mobile app at the local Supabase
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|PUBLISHABLE_KEY)=')"
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "EXPO_PUBLIC_WEB_URL=http://localhost:3000"
          } >> "$GITHUB_ENV"

      # The runner's own database, for the one fixture that sets what the API can't (a goal's
      # "added" time, 13c PR 3 Goals). Never a hosted project; the spec checks the host too.
      - name: Local database URL for E2E fixtures
        run: |
          eval "$(supabase status -o env | grep -E '^DB_URL=')"
          echo "E2E_DB_URL=${DB_URL}" >> "$GITHUB_ENV"

      - name: Export the app for web (development build)
        run: npm run preview:web -w @fin-creador/mobile
        env:
          CI: "1"

      # Positive control for the production check in the app job: the marker is found here.
      - name: Preview marker present in the development export
        run: node scripts/check-mobile-preview-excluded.mjs --expect-present apps/mobile/dist-web

      # Uses the Google Chrome preinstalled on the runner (Playwright channel "chrome").
      - name: Run mobile E2E at 390px (preview, tab shell)
        run: npm run e2e -w @fin-creador/mobile
        env:
          MOBILE_E2E_BACKEND: "1"

      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-design-system-screenshots
          path: apps/mobile/e2e-screenshots
          if-no-files-found: error
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-preview-traces
          path: apps/mobile/test-results
          retention-days: 7

  database:
    name: Migrations and pgTAP tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.111.0 # keep in step with the CLI used locally

      # Starts only Postgres and applies every migration in supabase/migrations to a
      # fresh database, so a broken migration fails here.
      - name: Start local database
        run: supabase db start

      - name: Run pgTAP tests
        run: supabase test db

      - name: Stop database
        if: always()
        run: supabase stop --no-backup

  # The newest migration applied to a database that already has rows from the previous one:
  # migrate up to the step before, seed, apply it, assert the backfill. Update MIGRATION and
  # the files in supabase/upgrade-checks when a later migration needs the same check.
  db-upgrade:
    name: Migration upgrade check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MIGRATION: "20261116120000"
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.111.0 # keep in step with the CLI used locally

      # The migration under test and every later one: they are applied together, in order.
      - name: Hold back the migration under test and later ones
        run: |
          mkdir -p "$RUNNER_TEMP/held"
          for f in supabase/migrations/*.sql; do
            [ "$(basename "$f" | cut -d_ -f1)" \< "$MIGRATION" ] || mv "$f" "$RUNNER_TEMP/held/"
          done
          ls "$RUNNER_TEMP/held"

      - name: Start the database at the previous migration
        run: supabase db start

      - name: Seed rows as before
        run: psql "$DB_URL" -f supabase/upgrade-checks/${MIGRATION}_seed.sql

      - name: Apply the held-back migrations
        run: mv "$RUNNER_TEMP"/held/*.sql supabase/migrations/ && supabase migration up --local

      - name: Assert the upgrade
        run: psql "$DB_URL" -f supabase/upgrade-checks/${MIGRATION}_assert.sql

      - name: Stop database
        if: always()
        run: supabase stop --no-backup

  e2e:
    name: E2E (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # Two commits of the PR's merge ref: HEAD^1 is the base branch, so the diff is the PR's own.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # A pull request that only changes docs/** or Markdown skips the E2E steps; the job still
      # reports success, so the required check passes. Any other event runs the full suite.
      - name: Docs-only change?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # Pushes to main always run everything.
          if [ "$EVENT" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A failing git diff fails the step (bash -e), never skips the tests.
          files="$(git diff --name-only HEAD^1 HEAD)"
          code="$(printf '%s\n' "$files" | grep -vE '^docs/|\.md$|^$' || true)"
          if [ "$EVENT" = "pull_request" ] && [ -z "$code" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Only docs/** or *.md changed: E2E skipped."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: 24
          cache: npm

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: steps.scope.outputs.docs_only != 'true'
        with:
          version: 2.111.0 # keep in step with the CLI used locally

      - name: Install dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: npm ci

      # Throwaway Supabase on the runner: Postgres (with all migrations), Auth, the API
      # gateway, PostgREST and the Mailpit test inbox. Never the hosted project.
      - name: Start local Supabase
        if: steps.scope.outputs.docs_only != 'true'
        run: supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      # Fictional instruments for the Investments E2E tests and one test knowledge base passage
      # for Roma's (the throwaway database only).
      - name: Seed E2E instruments
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          eval "$(supabase status -o env | grep -E '^DB_URL=')"
          psql "$DB_URL" -f apps/web/e2e/fixtures/instruments.sql
          psql "$DB_URL" -f apps/web/e2e/fixtures/knowledge.sql

      # Only the public URL and the public (publishable/anon) key are exported.
      - name: Point the web app at the local Supabase
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|PUBLISHABLE_KEY)=')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
          } >> "$GITHUB_ENV"

      - name: Build web
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run build

      # Uses the Google Chrome preinstalled on the runner (Playwright channel "chrome").
      # E2E_DB_URL (the runner's local database, never a hosted one) is only for this step: the
      # CSV export measurement seeds 10,000 rows there (e2e/reports-export-scale.spec.ts).
      - name: Run E2E tests
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          eval "$(supabase status -o env | grep -E '^DB_URL=')"
          E2E_DB_URL="$DB_URL" npm run test:e2e

      # Diagnostics only: the local Auth server's log (throwaway test users, no real data).
      - name: Show local Auth log
        if: failure() && steps.scope.outputs.docs_only != 'true'
        run: docker logs "$(docker ps --format '{{.Names}}' | grep -m1 supabase_auth)" 2>&1 | tail -n 200

      # Screenshots of the Income page at desktop, tablet and phone widths, for review.
      - name: Upload E2E screenshots
        if: always() && steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: apps/web/e2e-screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright report
        if: failure() && steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

      - name: Stop Supabase
        if: always() && steps.scope.outputs.docs_only != 'true'
        run: supabase stop --no-backup
