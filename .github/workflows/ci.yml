# CI for pull requests: app checks and database (migration + pgTAP) tests.
# Runs only against throwaway services on the GitHub runner. It never connects to the
# hosted Supabase project and uses no repository secrets.
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build web
        run: npm run build

      # Bundles the Expo app for iOS and Android (Hermes bytecode) without a device or
      # native build, so import, syntax and route errors fail here.
      - name: Bundle mobile
        run: npm run bundle:mobile
        env:
          CI: "1"

  database:
    name: Migrations and pgTAP tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.111.0 # keep in step with the CLI used locally

      # Starts only Postgres and applies every migration in supabase/migrations to a
      # fresh database, so a broken migration fails here.
      - name: Start local database
        run: supabase db start

      - name: Run pgTAP tests
        run: supabase test db

      - name: Stop database
        if: always()
        run: supabase stop --no-backup
