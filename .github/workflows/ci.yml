# CI for pull requests: app checks, secret check, database (migration + pgTAP) tests and
# web end-to-end tests.
# Runs only against throwaway services on the GitHub runner. It never connects to the
# hosted Supabase project and uses no repository secrets.
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The canary is a fake server-only value; the secret check below proves it never
      # reaches the client bundle. It is not a real key.
      - name: Build web
        run: npm run build
        env:
          FC_CANARY_SERVER_ONLY: fc-canary-${{ github.run_id }}-not-a-secret
          SUPABASE_SERVICE_ROLE_KEY: fc-canary-${{ github.run_id }}-not-a-secret

      # Bundles the Expo app for iOS and Android (Hermes bytecode) without a device or
      # native build, so import, syntax and route errors fail here.
      - name: Bundle mobile
        run: npm run bundle:mobile
        env:
          CI: "1"

      # Plain-JS export of the same app for the secret check (bytecode packs strings
      # together, which hides string boundaries from the scanner).
      - name: Bundle mobile (JS, for secret check)
        run: npm run bundle:mobile:js
        env:
          CI: "1"

      - name: Secret check (repo, web client bundle, mobile bundles)
        run: node scripts/check-secrets.mjs --repo apps/web/.next/static apps/mobile/dist-js
        env:
          CHECK_SECRETS_CANARY: fc-canary-${{ github.run_id }}-not-a-secret

  database:
    name: Migrations and pgTAP tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.111.0 # keep in step with the CLI used locally

      # Starts only Postgres and applies every migration in supabase/migrations to a
      # fresh database, so a broken migration fails here.
      - name: Start local database
        run: supabase db start

      - name: Run pgTAP tests
        run: supabase test db

      - name: Stop database
        if: always()
        run: supabase stop --no-backup

  e2e:
    name: E2E (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.111.0 # keep in step with the CLI used locally

      - name: Install dependencies
        run: npm ci

      # Throwaway Supabase on the runner: Postgres (with all migrations), Auth, the API
      # gateway, PostgREST and the Mailpit test inbox. Never the hosted project.
      - name: Start local Supabase
        run: supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      # Only the public URL and the public (publishable/anon) key are exported.
      - name: Point the web app at the local Supabase
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|PUBLISHABLE_KEY)=')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
          } >> "$GITHUB_ENV"

      - name: Build web
        run: npm run build

      # Uses the Google Chrome preinstalled on the runner (Playwright channel "chrome").
      - name: Run E2E tests
        run: npm run test:e2e

      # Diagnostics only: the local Auth server's log (throwaway test users, no real data).
      - name: Show local Auth log
        if: failure()
        run: docker logs "$(docker ps --format '{{.Names}}' | grep -m1 supabase_auth)" 2>&1 | tail -n 200

      # Screenshots of the Income page at desktop, tablet and phone widths, for review.
      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: apps/web/e2e-screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
